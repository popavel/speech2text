name: Speech2Text
options:
  bundleIdPrefix: com.speech2text
  # An Icon Composer *.icon is a package (directory). Without this, XcodeGen recurses into it and
  # adds its inner files individually, which stops Xcode from recognizing it as an app icon.
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
# App-wide settings, project-level so every target inherits one definition.
settings:
  base:
    # Release ritual: bump BOTH to the same X.Y.Z. They are deliberately identical —
    # Sparkle orders releases by CFBundleVersion (its comparator handles dotted triples),
    # and AboutView collapses the display to "Version X.Y.Z" when build == short.
    # 0.x.y is the pre-release series; 1.0.0 and up are reserved for user-facing releases.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0.0.0"
    # One Swift version for every target; a language bump is a one-line edit here.
    SWIFT_VERSION: "6.0"
    # Apple Silicon only, stated rather than inherited: Xcode's ARCHS_STANDARD default would
    # build arm64 + x86_64. macOS 26 is the last release supporting Intel and reaches only a
    # handful of 2019-20 models, none of which have a Neural Engine — and this app IS local
    # Whisper inference, so the x86_64 slice would ship a bad experience to a shrinking
    # audience while doubling every compile. Decided before 1.0.0 shipped, deliberately:
    # once an arm64+x86_64 build has an installed base, Sparkle's appcast has no clean way to
    # stop offering an arm64-only update to an Intel user. Debug already sets
    # ONLY_ACTIVE_ARCH, so this only changes Release (and CI).
    ARCHS: arm64
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.0.0"
  # Auto-update framework (binary xcframework; Xcode links and embeds it automatically). This zip
  # also carries Sparkle's CLI tools, which is where publish-release.yml gets `generate_appcast` —
  # SwiftPM verifies the whole artifact against the checksum in Sparkle's Package.swift, so the
  # appcast tooling is both integrity-checked and impossible to skew from the framework.
  # NEVER re-add a tarball download — Sparkle's release tarballs are ad-hoc signed, so a download
  # can't be verified and would hand the EdDSA signing secret to unauthenticated code.
  # Why: docs/distribution.md#the-appcast
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  # Test-only: runtime introspection of SwiftUI view bodies. Linked into the
  # unit-test bundle only — never into the app target.
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: "0.10.3"
targets:
  Speech2Text:
    type: application
    platform: macOS
    sources:
      - Speech2Text
      # Ships INSIDE the app bundle, not just in the repo: WhisperKit (MIT), the
      # swift-transformers code it vendors (Apache-2.0) and Sparkle (MIT, plus its own vendored
      # bsdiff/sais/Ed25519 notices) are all redistributed in the binary, and those licenses
      # require their notices to travel with it. Explicit `buildPhase` because a .md would
      # otherwise be inferred as a non-bundled source file.
      - path: THIRD-PARTY-LICENSES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speech2text.app
        ASSETCATALOG_COMPILER_APPICON_NAME: speech2text
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Speech2Text.entitlements
    # Signing settings deliberately absent: CODE_SIGN_STYLE / CODE_SIGN_IDENTITY /
    # DEVELOPMENT_TEAM / ENABLE_HARDENED_RUNTIME are injected on the xcodebuild command line by
    # publish-release.yml alone, so local dev and every CODE_SIGNING_ALLOWED=NO CI build are
    # untouched by the release configuration.
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    scheme:
      testTargets:
        - Speech2TextTests
        - Speech2TextIntegrationTests

  Speech2TextTests:
    type: bundle.unit-test
    platform: macOS
    # Speech2TextTestSupport holds test-only fixtures shared with the integration
    # target (e.g. TranscriptionLanguage.english), so they live in one place rather
    # than on the shipped type.
    sources:
      - Speech2TextTests
      - Speech2TextTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speech2text.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Speech2Text
      - package: ViewInspector

  Speech2TextIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Fixtures/ holds tiny checked-in media samples for formats Apple's stack
      # can decode but NOT synthesize (mp3/aac/ogg). Bundled as resources so the
      # decodability tests can load them; everything else is generated at runtime.
      - path: Speech2TextIntegrationTests
        excludes:
          - "Fixtures/**"
      - path: Speech2TextIntegrationTests/Fixtures
        buildPhase: resources
      # Shared test-only fixtures (see Speech2TextTests above).
      - Speech2TextTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speech2text.integrationtests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Speech2Text

  # End-to-end UI automation. XCUIApplication is XCTest-only — this is the one
  # target that uses XCTest rather than the repo's Swift Testing convention.
  # Kept out of the main scheme's test action (see the Speech2TextUITests scheme
  # below) so its TCC/launch flakiness can't gate every build.
  Speech2TextUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Speech2TextUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speech2text.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Speech2Text
        # XcodeGen's test-target preset injects BUNDLE_LOADER = "$(TEST_HOST)", which
        # belongs to unit-test bundles, not a ui-testing runner (a separate process).
        # TEST_HOST is undefined here so it already expands to empty, but suppress it
        # explicitly so the generated project never implies in-process loading.
        BUNDLE_LOADER: ""
    dependencies:
      - target: Speech2Text

# A dedicated, shared scheme for the UI tests so the default
# `-scheme Speech2Text test` run never pulls them in. Run explicitly with
# `-scheme Speech2TextUITests test`.
schemes:
  Speech2TextUITests:
    build:
      targets:
        Speech2Text: [run]
        Speech2TextUITests: [test]
    test:
      targets:
        - Speech2TextUITests
