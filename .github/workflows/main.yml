name: Main

# When should this workflow run?
on:
  push:
    branches: [main]   # runs on pushes to the main branch

  # MUST re-check the concurrency key before enabling this: a head-ref-keyed group puts the push
  # and PR runs for one commit in the same group, cancelling one and blocking the merge.
  # Why: docs/automation.md#push-only-deliberately-no-pull_request-trigger
  # pull_request:
  #   branches: [main]   # runs on pull requests targeting the main branch

  workflow_dispatch:   # lets you trigger it manually from the Actions tab

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared build-and-test job (see build-and-test.yml).
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml

  # Shared WhisperKit integration job (see integration-whisperkit.yml). Runs
  # after build-and-test passes.
  integration-whisperkit:
    name: Integration (WhisperKit)
    needs: build-and-test
    uses: ./.github/workflows/integration-whisperkit.yml

  # Shared XCUITest UI job (see ui-tests.yml). Signed run; gated on build-and-test
  # so a signed runner only spins up once the cheap build+test is green.
  ui-tests:
    name: UI Tests (XCUITest)
    needs: build-and-test
    uses: ./.github/workflows/ui-tests.yml
